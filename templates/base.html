<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<meta name="description" content="{% block description %}{% endblock %}">
{% if page_url %}<link rel="canonical" href="{{ page_url }}">
<meta property="og:url" content="{{ page_url }}">
{% else %}<meta name="robots" content="noindex">
{% endif %}<meta property="og:type" content="website">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:site_name" content="JellyComet">
<meta property="og:description" content="{{ self.description() }}">
{% if share %}<meta property="og:image" content="{{ share.url }}">
<meta property="og:image:width" content="{{ share.width }}">
<meta property="og:image:height" content="{{ share.height }}">
<meta property="og:image:alt" content="{{ share.alt }}">
<meta name="twitter:card" content="summary_large_image">
{% endif %}{% block meta %}{% endblock %}
<meta name="theme-color" content="#0a0e15">
<link rel="icon" type="image/svg+xml" href="{{ root }}assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ root }}assets/favicon.png">
<link rel="stylesheet" href="{{ root }}assets/site.css?v={{ css_version }}">
{% if structured %}<script type="application/ld+json">
{{ structured }}
</script>
{% endif %}</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars far"></div><div class="stars mid"></div><div class="stars near"></div></div>
<header class="site-header">
  <a class="brand" href="{{ root or './' }}"><img src="{{ root }}assets/logo-mark.svg" alt="" width="64" height="64"><span>Jelly<span class="comet">Comet</span></span></a>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <a class="github" href="https://github.com/{{ owner }}"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>github.com/{{ owner }}</a>
  <a class="github donate" href="https://paypal.me/jellycomet"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M1.5 8.2C1.5 4.3 4.4 1.2 8 1.2s6.5 3.1 6.5 7c-.9.6-1.7.6-2.6 0-.9.6-1.7.6-2.6 0-.9.6-1.7.6-2.6 0-.9.6-1.7.6-2.6 0-.9.6-1.7.6-2.6 0ZM8 7.3C6.1 6.1 5.6 5.2 6.1 4.4c.5-.7 1.4-.6 1.9.1.5-.7 1.4-.8 1.9-.1.5.8 0 1.7-1.9 2.9Z"/><path fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" d="M4.4 9.4c-.7 1.3.7 2.2 0 3.6M6.9 9.4c-.7 1.6.7 2.7 0 5M9.1 9.4c.7 1.6-.7 2.7 0 5M11.6 9.4c.7 1.3-.7 2.2 0 3.6"/></svg>Donations</a>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
